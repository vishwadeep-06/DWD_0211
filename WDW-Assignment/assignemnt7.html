<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Menu</title>
  <style>
    .output {
      max-width: 1045px;
      margin: 20px auto;
      padding: 28px 80px;
      border: 1px solid #70d878;
      box-sizing: border-box;
    }

    nav {
      background-color: #333;
      padding: 15px 25px;
    }

    nav ul {
      display: flex;
      gap: 55px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: #fff;
      font-size: 22px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="output">
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#courses">Courses</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
