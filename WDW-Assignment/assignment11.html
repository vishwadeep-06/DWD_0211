<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        nav a {
            margin-right: 10px;
        }

        h1 {
            font-size: 36px;
        }

        .image-box {
            width: 280px;
            height: 35px;
            border: 1px solid gray;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            width: 270px;
        }

        button {
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Skip Link -->
    <a href="#main-content">Skip to main content</a>

    <!-- Navigation -->
    <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <!-- Main Content -->
    <main id="main-content">

        <h1>Accessible Page</h1>

        <!-- Image with ALT Text -->
        <div class="image-box">
            <img src="image.jpg"
                 alt="An example image for accessibility">
        </div>

        <!-- Close Button -->
        <button type="button" aria-label="Close">
            X
        </button>

        <br><br>

        <!-- Search Box -->
        <label for="search">Search:</label>

        <input type="search"
               id="search"
               name="search"
               aria-label="Search the website">

    </main>

</body>
</html>
