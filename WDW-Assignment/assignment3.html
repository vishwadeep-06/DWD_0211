<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block and Inline Elements</title>
  <style>
    .container {
      border: 1px solid #d3d3d3;
      padding: 20px 60px;
      margin: 20px;
    }

    .block-box {
      background-color: #add8e6; /* Light blue */
      margin-bottom: 5px;
      padding: 2px 4px;
      font-weight: bold;
    }

    .inline-box {
      background-color: #90ee90; /* Light green */
      padding: 2px 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="block-box">Block 1</div>
    <div class="block-box">Block 2</div>

    <span class="inline-box">Inline 1</span>
    <span class="inline-box">Inline 2</span>
    <span class="inline-box">Inline 3</span>
  </div>

</body>
</html>
