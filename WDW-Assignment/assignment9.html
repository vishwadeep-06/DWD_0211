<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Text Formatting & Quotations</title>
</head>
<body>

    <!-- Indented block quote -->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <!-- Short inline quotation (automatically adds quotation marks) -->
    <p>As he said, <q>Stay hungry, stay foolish.</q></p>

    <!-- Work title citation (renders in italics) -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>

    <!-- Abbreviation with a hover tooltip -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- Contact information (renders in italics as a block) -->
    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <!-- Deleted (strikethrough) and inserted (underlined) text -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>

</body>
</html>
